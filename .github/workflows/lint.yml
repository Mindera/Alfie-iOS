name: Lint

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

  merge_group:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run SwiftLint
        run: ./Alfie/scripts/lint.sh
