name: Alfie CI/CD

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

  merge_group:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTS_PATH: "/tmp/alfie-artifacts"
  SPM_CLONED_DEPENDENCIES_PATH: "/tmp/SourcePackages"

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Cache Homebrew
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('Brewfile') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Restore Ruby Gems
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile', 'Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-${{ hashFiles('Gemfile') }}-
            gems-${{ runner.os }}-

      - name: Restore Swift Package Manager Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CLONED_DEPENDENCIES_PATH }}
          key: spm-${{ runner.os }}-${{ hashFiles('Alfie/AlfieKit/Package.swift', 'Alfie/AlfieKit/Package.resolved', 'Alfie/Alfie.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('Alfie/AlfieKit/Package.resolved', 'Alfie/Alfie.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: Install Homebrew formulas
        run: brew bundle install

      - name: Install Ruby dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Import GPG Private Key and Decrypt sensitive files
        env:
          SECRETS_GPG_PRIVATE_KEY: ${{ secrets.SECRETS_GPG_PRIVATE_KEY }}
          SECRETS_GPG_PASSPHRASE: ${{ secrets.SECRETS_GPG_PASSPHRASE }}
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          chmod 600 ~/.gnupg/gpg-agent.conf
          chmod 600 ~/.gnupg/gpg.conf
          echo "$SECRETS_GPG_PRIVATE_KEY" | gpg --batch --yes --import
          gpg-connect-agent reloadagent /bye || true
          git secret reveal -p "$SECRETS_GPG_PASSPHRASE"

      - name: Run Tests
        run: bundle exec fastlane ios test --env default
        env:
          BUILD_CONFIGURATION: "Debug"

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results
          path: |
            ${{ env.ARTIFACTS_PATH }}/*.xcresult
            ${{ env.ARTIFACTS_PATH }}/*.junit
          retention-days: 7

  bff-tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BFF_CHECKOUT: Alfie-BFF
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Mint Alfie-BFF read token
        id: bff-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.BFF_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.BFF_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Alfie-BFF
          permission-contents: read

      - name: Checkout Alfie-BFF main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.repository_owner }}/Alfie-BFF
          ref: main
          token: ${{ steps.bff-token.outputs.token }}
          path: ${{ env.BFF_CHECKOUT }}
          persist-credentials: false

      - name: Report BFF commit
        run: |
          echo "Mock BFF: \`$GITHUB_REPOSITORY_OWNER/Alfie-BFF@$(git -C "$BFF_CHECKOUT" rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ${{ env.BFF_CHECKOUT }}/yarn.lock

      - name: Cache BFF node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.BFF_CHECKOUT }}/node_modules
          key: bff-node-modules-${{ runner.os }}-node20-${{ hashFiles(format('{0}/yarn.lock', env.BFF_CHECKOUT)) }}

      - name: Cache Homebrew
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('Brewfile') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Restore Swift Package Manager Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CLONED_DEPENDENCIES_PATH }}
          key: spm-${{ runner.os }}-${{ hashFiles('Alfie/AlfieKit/Package.swift', 'Alfie/AlfieKit/Package.resolved', 'Alfie/Alfie.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install Homebrew formulas
        run: brew bundle install

      - name: Import GPG Private Key and Decrypt sensitive files
        env:
          SECRETS_GPG_PRIVATE_KEY: ${{ secrets.SECRETS_GPG_PRIVATE_KEY }}
          SECRETS_GPG_PASSPHRASE: ${{ secrets.SECRETS_GPG_PASSPHRASE }}
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          chmod 600 ~/.gnupg/gpg-agent.conf
          chmod 600 ~/.gnupg/gpg.conf
          echo "$SECRETS_GPG_PRIVATE_KEY" | gpg --batch --yes --import
          gpg-connect-agent reloadagent /bye || true
          git secret reveal -p "$SECRETS_GPG_PASSPHRASE"

      - name: Run Integration and UI Tests
        run: ./Alfie/scripts/run-integration-tests.sh
        env:
          ALFIE_BFF_PATH: ${{ github.workspace }}/${{ env.BFF_CHECKOUT }}
          ALFIE_XCODEBUILD_ARGS: "-onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation"

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bff-test-results
          path: |
            /tmp/alfie_integration_test.xcresult
            /tmp/alfie_ui_test.xcresult
            /tmp/alfie_bff.log
          retention-days: 7

  release:
    needs: [unit-tests, bff-tests]
    runs-on: macos-26
    timeout-minutes: 60
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Cache Homebrew
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('Brewfile') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Restore Ruby Gems
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile', 'Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-${{ hashFiles('Gemfile') }}-
            gems-${{ runner.os }}-

      - name: Restore Swift Package Manager Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CLONED_DEPENDENCIES_PATH }}
          key: spm-${{ runner.os }}-${{ hashFiles('Alfie/AlfieKit/Package.swift', 'Alfie/AlfieKit/Package.resolved', 'Alfie/Alfie.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install Homebrew formulas
        run: brew bundle install

      - name: Configure Bundler
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Set up SSH for match repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Import GPG Private Key and Decrypt sensitive files
        env:
          SECRETS_GPG_PRIVATE_KEY: ${{ secrets.SECRETS_GPG_PRIVATE_KEY }}
          SECRETS_GPG_PASSPHRASE: ${{ secrets.SECRETS_GPG_PASSPHRASE }}
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          chmod 600 ~/.gnupg/gpg-agent.conf
          chmod 600 ~/.gnupg/gpg.conf
          echo "$SECRETS_GPG_PRIVATE_KEY" | gpg --batch --yes --import
          gpg-connect-agent reloadagent /bye || true
          git secret reveal -p "$SECRETS_GPG_PASSPHRASE"

      - name: Build and deploy release to TestFlight
        run: bundle exec fastlane ios release --env default
        env:
          BUILD_CONFIGURATION: "Release"
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_CONTENT_BASE64: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT_BASE64 }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_TEAM_ID: ${{ secrets.APPSTORE_CONNECT_TEAM_ID }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          ITUNESCONNECT_TEAM_ID: ${{ secrets.ITUNESCONNECT_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
