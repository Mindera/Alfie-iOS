name: Alfie CI/CD

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

  merge_group:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARTIFACTS_PATH: "/tmp/alfie-artifacts"
  DERIVED_DATA_PATH: build/DerivedData
  SOURCE_PACKAGES_PATH: build/DerivedData/SourcePackages

jobs:
  tests:
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BFF_CHECKOUT: Alfie-BFF
      CAN_READ_BFF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha }}
        run: |
          DOCS_ONLY="$(./Alfie/scripts/ci-docs-only.sh "$BASE")"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          [ "$DOCS_ONLY" = false ] || echo "Docs-only change: build and tests skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Alfie-BFF main
        if: steps.changes.outputs.docs_only != 'true' && env.CAN_READ_BFF == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.repository_owner }}/Alfie-BFF
          ref: main
          token: ${{ secrets.BFF_READ_TOKEN }}
          path: ${{ env.BFF_CHECKOUT }}
          persist-credentials: false

      - name: Report BFF commit
        if: steps.changes.outputs.docs_only != 'true' && env.CAN_READ_BFF == 'true'
        run: |
          echo "Mock BFF: \`$GITHUB_REPOSITORY_OWNER/Alfie-BFF@$(git -C "$BFF_CHECKOUT" rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.changes.outputs.docs_only != 'true' && env.CAN_READ_BFF == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.BFF_CHECKOUT }}/.nvmrc

      - name: Cache BFF node_modules
        if: steps.changes.outputs.docs_only != 'true' && env.CAN_READ_BFF == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.BFF_CHECKOUT }}/node_modules
          key: bff-node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/.nvmrc', env.BFF_CHECKOUT), format('{0}/yarn.lock', env.BFF_CHECKOUT)) }}

      - name: Set up iOS job
        id: setup-ios
        if: steps.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ios
        with:
          gpg-private-key: ${{ secrets.SECRETS_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.SECRETS_GPG_PASSPHRASE }}
          spm-cloned-dependencies-path: ${{ env.SOURCE_PACKAGES_PATH }}

      - name: Restore build cache
        if: steps.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/restore-build-cache
        with:
          xcode-version: ${{ steps.setup-ios.outputs.xcode-version }}
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          source-packages-path: ${{ env.SOURCE_PACKAGES_PATH }}

      - name: Verify
        id: verify
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          if [ "$CAN_READ_BFF" = true ]; then
            ./Alfie/scripts/verify.sh
          else
            ./Alfie/scripts/verify.sh --only-unit
          fi
        env:
          ALFIE_BFF_PATH: ${{ github.workspace }}/${{ env.BFF_CHECKOUT }}

      - name: Upload Test Results
        if: failure() || cancelled()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results
          path: |
            /tmp/alfie_*.xcresult
            /tmp/alfie_*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload UI Runner Stall Evidence
        if: success() && steps.verify.outputs.ui_runner_stalled == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ui-runner-stall
          path: |
            /tmp/alfie_ui_test.xcresult
            /tmp/alfie_ui_*.log
          if-no-files-found: warn
          retention-days: 7

  build-cache:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-build-cache-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up iOS job
        id: setup-ios
        uses: ./.github/actions/setup-ios
        with:
          gpg-private-key: ${{ secrets.SECRETS_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.SECRETS_GPG_PASSPHRASE }}
          spm-cloned-dependencies-path: ${{ env.SOURCE_PACKAGES_PATH }}

      - name: Restore build cache
        id: build-cache
        uses: ./.github/actions/restore-build-cache
        with:
          xcode-version: ${{ steps.setup-ios.outputs.xcode-version }}
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          source-packages-path: ${{ env.SOURCE_PACKAGES_PATH }}

      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ./Alfie/scripts/build-for-verification.sh

      - name: Save Swift Package Manager Cache
        if: steps.setup-ios.outputs.spm-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup-ios.outputs.spm-cache-path }}
          key: ${{ steps.setup-ios.outputs.spm-cache-key }}

      - name: Leave the Swift packages out of the DerivedData cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: rm -rf "$SOURCE_PACKAGES_PATH"

      - name: Save Xcode DerivedData
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Delete the caches this run replaced
        run: ./Alfie/scripts/prune-build-caches.sh "$GITHUB_REF" "derived-$RUNNER_OS-xcode" "spm-$RUNNER_OS-xcode"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Upload Build Log
        if: failure() || cancelled()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-cache-log
          path: /tmp/alfie_build.log
          if-no-files-found: warn
          retention-days: 7

  release:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up iOS job
        uses: ./.github/actions/setup-ios
        with:
          gpg-private-key: ${{ secrets.SECRETS_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.SECRETS_GPG_PASSPHRASE }}
          spm-cloned-dependencies-path: ${{ env.SOURCE_PACKAGES_PATH }}
          ruby: true

      - name: Set up SSH for match repo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Build and deploy release to TestFlight
        run: bundle exec fastlane ios release --env default
        env:
          SPM_CLONED_DEPENDENCIES_PATH: ${{ github.workspace }}/${{ env.SOURCE_PACKAGES_PATH }}
          BUILD_CONFIGURATION: "Release"
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_CONTENT_BASE64: ${{ secrets.APPSTORE_CONNECT_KEY_CONTENT_BASE64 }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_TEAM_ID: ${{ secrets.APPSTORE_CONNECT_TEAM_ID }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          ITUNESCONNECT_TEAM_ID: ${{ secrets.ITUNESCONNECT_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
